<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QR Maker">
    <title>QR-gen• DBDevStudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=SF+Pro+Display:wght@400;500;600&amp;display=swap');
        
        :root {
            --primary: #007AFF;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        }
        
        .apple-container {
            max-width: 480px;
            margin: 0 auto;
            background: #f8f9fa;
            box-shadow: 0 0 0 1px #e5e7eb;
        }
        
        .ios-header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .segmented-control {
            background: #e5e7eb;
            border-radius: 9999px;
            padding: 3px;
            display: flex;
        }
        
        .segment-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 9999px;
            transition: all 0.2s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .segment-btn.active {
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            color: #000;
        }
        
        .qr-container {
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08),
                        0 4px 10px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f1f3;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .qr-canvas {
            image-rendering: crisp-edges;
            border-radius: 16px;
        }
        
        .form-input {
            transition: all 0.2s ease;
            font-size: 15px;
        }
        
        .form-input:focus {
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
            outline: none;
        }
        
        .qr-label {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            letter-spacing: -.3px;
        }
        
        .ios-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        
        .section-header {
            font-size: 15px;
            font-weight: 700;
            color: #1f2937;
            letter-spacing: -.3px;
        }
        
        .apple-btn {
            transition: all .2s cubic-bezier(0.23, 1, 0.32, 1);
            font-weight: 600;
        }
        
        .apple-btn:active {
            transform: scale(0.96);
        }
        
        .type-pill {
            font-size: 12.5px;
            padding: 6px 14px;
            font-weight: 600;
        }
        
        .qr-shadow {
            box-shadow: 0 15px 35px -10px rgb(0 0 0 / 12%),
                        0 8px 15px -8px rgb(0 0 0 / 8%);
        }
        
        .status-bar {
            height: 44px;
        }
        
        @media (max-width: 480px) {
            .apple-container {
                box-shadow: none;
                border-radius: 0;
            }
        }
        
        .qr-wrapper {
            padding: 20px;
            background: #fff;
            border-radius: 22px;
        }
        
        .dynamic-form {
            animation: fadeInUp 0.25s ease forwards;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-[#f2f3f5]">
    <!-- iOS Status Bar Simulation -->
    <div class="max-w-[480px] mx-auto">
        <div class="status-bar bg-[#f8f9fa] flex items-center px-5 pt-3">
            <div class="flex-1"></div>
            <div class="flex items-center gap-x-1">
                <i class="fa-solid fa-signal text-xs"></i>
                <i class="fa-solid fa-wifi text-xs"></i>
                <div class="flex items-center gap-x-0.5">
                    <span class="text-xs font-semibold">92</span>
                    <i class="fa-solid fa-battery-full text-xs"></i>
                </div>
            </div>
        </div>
        
        <!-- Main Container -->
        <div class="apple-container min-h-screen max-w-[480px] mx-auto rounded-b-[40px] shadow-xl overflow-hidden">
            
            <!-- Header -->
            <div class="ios-header px-5 pt-4 pb-3 flex items-center justify-between sticky top-0 z-50 border-b border-[#e5e7eb]">
                <div class="flex items-center gap-x-3">
                    <div class="w-9 h-9 bg-gradient-to-br from-[#007AFF] to-[#0062cc] flex items-center justify-center rounded-2xl shadow-inner">
                        <i class="fa-solid fa-qrcode text-white text-3xl"></i>

                        <h1 class="font-extrabold text-3xl tracking-tighter">QR-gen</h1>
                        <p class="text-[10px] text-[#8e8e93] -mt-1 font-semibold">DBDevStudio</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-x-1">
                    <div onclick="resetApp()"

            <!-- Content -->
            <div class="px-5 pt-5 pb-8">
                
                <!-- Type Selection -->
                <div class="mb-5">

                <!-- Dynamic Form -->

                </div>
                
                <!-- QR Preview -->
                <div class="mb-4">
                    <div class="qr-label px-1 mb-2.5 flex items-center justify-between">
                        <span>PREVIEW QR CODE</span>

                              class="px-3 py-1 text-xs font-bold bg-[#007AFF] text-white rounded-2xl flex items-center justify-center"
                              style="font-size:10.5px; height:18px;">
                            URL

                <!-- Actions -->

                    <button onclick="downloadQR()"

                    <button onclick="copyToClipboard()"

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind script
        function initializeTailwind() {
            document.documentElement.style.setProperty('--accent', '#007AFF');
        }
        
        // QR Code Generator - Pure JS implementation (no external deps)
        // Based on a compact QRCode.js implementation
        const QRCode = (function() {
            const QRMode = { MODE_8BIT_BYTE: 4 };
            
            function QR8bitByte(data) {
                this.mode = QRMode.MODE_8BIT_BYTE;
                this.data = data;
            }
            
            QR8bitByte.prototype = {
                getLength: function() { return this.data.length; },
                write: function(buffer) {
                    for (let i = 0; i < this.data.length; i++) {
                        buffer.put(this.data.charCodeAt(i), 8);
                    }
                }
            };
            
            function QRBitBuffer() {
                this.buffer = [];
                this.length = 0;
            }
            
            QRBitBuffer.prototype = {
                get: function(index) { return ((this.buffer[Math.floor(index / 8)] >>> (7 - index % 8)) & 1) == 1; },
                put: function(num, length) {
                    for (let i = 0; i < length; i++) {
                        this.putBit(((num >>> (length - i - 1)) & 1) == 1);
                    }
                },
                putBit: function(bit) {
                    if (this.length == this.buffer.length * 8) this.buffer.push(0);
                    if (bit) this.buffer[Math.floor(this.length / 8)] |= (0x80 >>> (this.length % 8));
                    this.length++;
                }
            };
            
            function QRCodeModel(typeNumber, errorCorrectionLevel) {
                this.typeNumber = typeNumber;
                this.errorCorrectionLevel = errorCorrectionLevel;
                this.modules = null;
                this.moduleCount = 0;
                this.dataCache = null;
                this.dataList = [];
            }
            
            QRCodeModel.prototype = {
                addData: function(data) {
                    const newData = new QR8bitByte(data);
                    this.dataList.push(newData);
                    this.dataCache = null;
                },
                isDark: function(row, col) {
                    if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
                        throw new Error(row + "," + col);
                    }
                    return this.modules[row][col];
                },
                getModuleCount: function() { return this.moduleCount; },
                make: function() {
                    this.makeImpl(false, this.getBestMaskPattern());
                },
                makeImpl: function(test, maskPattern) {
                    this.moduleCount = this.typeNumber * 4 + 17;
                    this.modules = new Array(this.moduleCount);
                    for (let row = 0; row < this.moduleCount; row++) {
                        this.modules[row] = new Array(this.moduleCount);
                        for (let col = 0; col < this.moduleCount; col++) {
                            this.modules[row][col] = null;
                        }
                    }
                    this.setupPositionProbePattern(0, 0);
                    this.setupPositionProbePattern(this.moduleCount - 7, 0);
                    this.setupPositionProbePattern(0, this.moduleCount - 7);
                    this.setupPositionAdjustPattern();
                    this.setupTimingPattern();
                    this.setupTypeInfo(test, maskPattern);
                    if (this.typeNumber >= 7) {
                        this.setupTypeNumber(test);
                    }
                    if (this.dataCache == null) {
                        this.dataCache = QRCodeModel.createData(this.typeNumber, this.errorCorrectionLevel, this.dataList);
                    }
                    this.mapData(this.dataCache, maskPattern);
                },
                setupPositionProbePattern: function(row, col) {
                    for (let r = -1; r <= 7; r++) {
                        if (row + r <= -1 || this.moduleCount <= row + r) continue;
                        for (let c = -1; c <= 7; c++) {
                            if (col + c <= -1 || this.moduleCount <= col + c) continue;
                            this.modules[row + r][col + c] = (0 <= r && r <= 6 && (c == 0 || c == 6)) ||
                                (0 <= c && c <= 6 && (r == 0 || r == 6)) ||
                                (2 <= r && r <= 4 && 2 <= c && c <= 4);
                        }
                    }
                },
                getBestMaskPattern: function() {
                    let minLostPoint = 0;
                    let pattern = 0;
                    for (let i = 0; i < 8; i++) {
                        this.makeImpl(true, i);
                        const lostPoint = QRUtil.getLostPoint(this);
                        if (i == 0 || minLostPoint > lostPoint) {
                            minLostPoint = lostPoint;
                            pattern = i;
                        }
                    }
                    return pattern;
                },
                setupTimingPattern: function() {
                    for (let r = 8; r < this.moduleCount - 8; r++) {
                        if (this.modules[r][6] != null) continue;
                        this.modules[r][6] = (r % 2 == 0);
                    }
                    for (let c = 8; c < this.moduleCount - 8; c++) {
                        if (this.modules[6][c] != null) continue;
                        this.modules[6][c] = (c % 2 == 0);
                    }
                },
                setupPositionAdjustPattern: function() {
                    const pos = QRUtil.getPatternPosition(this.typeNumber);
                    for (let i = 0; i < pos.length; i++) {
                        for (let j = 0; j < pos.length; j++) {
                            const row = pos[i];
                            const col = pos[j];
                            if (this.modules[row][col] != null) continue;
                            for (let r = -2; r <= 2; r++) {
                                for (let c = -2; c <= 2; c++) {
                                    this.modules[row + r][col + c] = r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0);
                                }
                            }
                        }
                    }
                },
                setupTypeNumber: function(test) {
                    const bits = QRUtil.getBCHTypeNumber(this.typeNumber);
                    for (let i = 0; i < 18; i++) {
                        const mod = (!test && ((bits >> i) & 1) == 1);
                        this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
                        this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
                    }
                },
                setupTypeInfo: function(test, maskPattern) {
                    const data = (this.errorCorrectionLevel << 3) | maskPattern;
                    const bits = QRUtil.getBCHTypeInfo(data);
                    for (let i = 0; i < 15; i++) {
                        const mod = (!test && ((bits >> i) & 1) == 1);
                        if (i < 6) {
                            this.modules[i][8] = mod;
                        } else if (i < 8) {
                            this.modules[i + 1][8] = mod;
                        } else {
                            this.modules[this.moduleCount - 15 + i][8] = mod;
                        }
                        if (i < 8) {
                            this.modules[8][this.moduleCount - i - 1] = mod;
                        } else if (i < 9) {
                            this.modules[8][15 - i - 1 + 1] = mod;
                        } else {
                            this.modules[8][15 - i - 1] = mod;
                        }
                    }
                    this.modules[this.moduleCount - 8][8] = (!test);
                },
                mapData: function(data, maskPattern) {
                    let inc = -1;
                    let row = this.moduleCount - 1;
                    let bitIndex = 7;
                    let byteIndex = 0;
                    for (let col = this.moduleCount - 1; col > 0; col -= 2) {
                        if (col == 6) col--;
                        while (true) {
                            for (let c = 0; c < 2; c++) {
                                if (this.modules[row][col - c] == null) {
                                    let dark = false;
                                    if (byteIndex < data.length) {
                                        dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                                    }
                                    const mask = QRUtil.getMask(maskPattern, row, col - c);
                                    if (mask) {
                                        dark = !dark;
                                    }
                                    this.modules[row][col - c] = dark;
                                    bitIndex--;
                                    if (bitIndex == -1) {
                                        byteIndex++;
                                        bitIndex = 7;
                                    }
                                }
                            }
                            row += inc;
                            if (row < 0 || this.moduleCount <= row) {
                                row -= inc;
                                inc = -inc;
                                break;
                            }
                        }
                    }
                }
            };
            
            QRCodeModel.createData = function(typeNumber, errorCorrectionLevel, dataList) {
                const rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);
                const buffer = new QRBitBuffer();
                for (let i = 0; i < dataList.length; i++) {
                    const data = dataList[i];
                    buffer.put(data.mode, 4);
                    buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
                    data.write(buffer);
                }
                let totalDataCount = 0;
                for (let i = 0; i < rsBlocks.length; i++) {
                    totalDataCount += rsBlocks[i].dataCount;
                }
                if (buffer.length > totalDataCount * 8) {
                    throw new Error("code length overflow. (" + buffer.length + ">" + (totalDataCount * 8) + ")");
                }
                if (buffer.length + 4 <= totalDataCount * 8) {
                    buffer.put(0, 4);
                }
                while (buffer.length % 8 != 0) {
                    buffer.putBit(false);
                }
                while (true) {
                    if (buffer.length >= totalDataCount * 8) break;
                    buffer.put(0xEC, 8);
                    if (buffer.length >= totalDataCount * 8) break;
                    buffer.put(0x11, 8);
                }
                return QRCodeModel.createBytes(buffer, rsBlocks);
            };
            
            QRCodeModel.createBytes = function(buffer, rsBlocks) {
                let offset = 0;
                let maxDcCount = 0;
                let maxEcCount = 0;
                const dcdata = new Array(rsBlocks.length);
                const ecdata = new Array(rsBlocks.length);
                for (let r = 0; r < rsBlocks.length; r++) {
                    const dcCount = rsBlocks[r].dataCount;
                    const ecCount = rsBlocks[r].totalCount - dcCount;
                    maxDcCount = Math.max(maxDcCount, dcCount);
                    maxEcCount = Math.max(maxEcCount, ecCount);
                    dcdata[r] = new Array(dcCount);
                    for (let i = 0; i < dcdata[r].length; i++) {
                        dcdata[r][i] = 0xff & buffer.buffer[i + offset];
                    }
                    offset += dcCount;
                    const rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
                    const rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
                    const modPoly = rawPoly.mod(rsPoly);
                    ecdata[r] = new Array(rsPoly.getLength() - 1);
                    for (let i = 0; i < ecdata[r].length; i++) {
                        const modIndex = i + modPoly.getLength() - ecdata[r].length;
                        ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
                    }
                }
                let totalCodeCount = 0;
                for (let i = 0; i < rsBlocks.length; i++) {
                    totalCodeCount += rsBlocks[i].totalCount;
                }
                const data = new Array(totalCodeCount);
                let index = 0;
                for (let i = 0; i < maxDcCount; i++) {
                    for (let r = 0; r < rsBlocks.length; r++) {
                        if (i < dcdata[r].length) {
                            data[index++] = dcdata[r][i];
                        }
                    }
                }
                for (let i = 0; i < maxEcCount; i++) {
                    for (let r = 0; r < rsBlocks.length; r++) {
                        if (i < ecdata[r].length) {
                            data[index++] = ecdata[r][i];
                        }
                    }
                }
                return data;
            };
            
            const QRUtil = {
                PATTERN_POSITION_TABLE: [
                    [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50], [6, 30, 54],
                    [6, 32, 58], [6, 34, 62], [6, 26, 46, 66], [6, 26, 48, 70], [6, 26, 50, 74], [6, 30, 54, 78], [6, 30, 56, 82],
                    [6, 30, 58, 86], [6, 34, 62, 90], [6, 28, 50, 72, 94], [6, 26, 50, 74, 98], [6, 30, 54, 78, 102],
                    [6, 34, 58, 82, 106], [6, 30, 58, 86, 114], [6, 34, 62, 90, 118], [6, 30, 54, 78, 102, 126],
                    [6, 24, 50, 76, 102, 128], [6, 28, 54, 80, 106, 132], [6, 32, 58, 84, 110, 136], [6, 30, 58, 86, 114, 142],
                    [6, 34, 62, 90, 118, 146], [6, 30, 54, 78, 102, 126, 150], [6, 34, 62, 90, 118, 146, 174],
                    [6, 30, 58, 86, 114, 142, 170], [6, 34, 62, 90, 118, 146, 174, 202]
                ],
                G15: (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
                G18: (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
                G15_MASK: (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1),
                getBCHTypeInfo: function(data) {
                    let d = data << 10;
                    while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
                        d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15)));
                    }
                    return ((data << 10) | d) ^ QRUtil.G15_MASK;
                },
                getBCHTypeNumber: function(data) {
                    let d = data << 12;
                    while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
                        d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18)));
                    }
                    return (data << 12) | d;
                },
                getBCHDigit: function(data) {
                    let digit = 0;
                    while (data != 0) {
                        digit++;
                        data >>>= 1;
                    }
                    return digit;
                },
                getPatternPosition: function(typeNumber) {
                    return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
                },
                getMask: function(maskPattern, i, j) {
                    switch (maskPattern) {
                        case 0: return (i + j) % 2 == 0;
                        case 1: return i % 2 == 0;
                        case 2: return j % 3 == 0;
                        case 3: return (i + j) % 3 == 0;
                        case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 == 0;
                        case 5: return (i * j) % 2 + (i * j) % 3 == 0;
                        case 6: return ((i * j) % 2 + (i * j) % 3) % 2 == 0;
                        case 7: return ((i * j) % 3 + (i + j) % 2) % 2 == 0;
                        default: throw new Error("bad maskPattern:" + maskPattern);
                    }
                },
                getErrorCorrectPolynomial: function(errorCorrectLength) {
                    let a = new QRPolynomial([1], 0);
                    for (let i = 0; i < errorCorrectLength; i++) {
                        a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
                    }
                    return a;
                },
                getLengthInBits: function(mode, type) {
                    if (1 <= type && type < 10) {
                        switch (mode) {
                            case 1: return 10;
                            case 2: return 9;
                            case 4: return 8;
                            case 8: return 8;
                            default: throw new Error("mode:" + mode);
                        }
                    } else if (type < 27) {
                        switch (mode) {

                            case 2: return 11;
                            case 4: return 16;
                            case 8: return 16;
                            default: throw new Error("mode:" + mode);
                        }
                    } else if (type < 41) {

                            case 2: return 13;
                            case 4: return 16;
                            case 8: return 16;

                getLostPoint: function(qrCode) {
                    const moduleCount = qrCode.getModuleCount();
                    let lostPoint = 0;
                    for (let row = 0; row < moduleCount; row++) {
                        for (let col = 0; col < moduleCount; col++) {
                            let sameCount = 0;
                            const dark = qrCode.isDark(row, col);
                            for (let r = -1; r <= 1; r++) {
                                if (row + r < 0 || moduleCount <= row + r) continue;

                                    if (col + c < 0 || moduleCount <= col + c) continue;
                                    if (r == 0 && c == 0) continue;
                                    if (dark == qrCode.isDark(row + r, col + c)) {
                                        sameCount++;
                                    }
                                }
                            }
                            if (sameCount > 5) {
                                lostPoint += (3 + sameCount - 5);
                            }
                        }
                    }
                    for (let row = 0; row < moduleCount - 1; row++) {
                        for (let col = 0; col < moduleCount - 1; col++) {
                            let count = 0;
                            if (qrCode.isDark(row, col)) count++;
                            if (qrCode.isDark(row + 1, col)) count++;
                            if (qrCode.isDark(row, col + 1)) count++;
                            if (qrCode.isDark(row + 1, col + 1)) count++;
                            if (count == 0 || count == 4) {
                                lostPoint += 3;
                            }

                    for (let row = 0; row < moduleCount; row++) {
                        for (let col = 0; col < moduleCount - 6; col++) {
                            if (qrCode.isDark(row, col) && !qrCode.isDark(row, col + 1) && qrCode.isDark(row, col + 2) && qrCode.isDark(row, col + 3) && qrCode.isDark(row, col + 4) && !qrCode.isDark(row, col + 5) && qrCode.isDark(row, col + 6)) {

                            }
                        }

                    for (let col = 0; col < moduleCount; col++) {
                        for (let row = 0; row < moduleCount - 6; row++) {
                            if (qrCode.isDark(row, col) && !qrCode.isDark(row + 1, col) && qrCode.isDark(row + 2, col) && qrCode.isDark(row + 3, col) && qrCode.isDark(row + 4, col) && !qrCode.isDark(row + 5, col) && qrCode.isDark(row + 6, col)) {
                                lostPoint += 40;
                            }
                        }

                    for (let col = 0; col < moduleCount; col++) {
                        for (let row = 0; row < moduleCount; row++) {
                            if (qrCode.isDark(row, col)) {

                    while (n < 0) { n += 255; }

                    for (let i = 0; i < this.getLength(); i++) {

                            num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));

                for (let i = 0; i < length; i++) {
                    const count = rsBlock[i * 3 + 0];
                    const totalCount = rsBlock[i * 3 + 1];
                    const dataCount = rsBlock[i * 3 + 2];

                        if (i == 0 || minLostPoint > lostPoint) {

                setupTimingPattern: function() {

        function getQRContent() {
            let content = "";
            
            switch(currentType) {
                case "url":
                    const urlInput = document.getElementById("input-url");
                    content = urlInput ? urlInput.value.trim() : "https://apple.com";
                    break;
                    
                case "text":
                    const textInput = document.getElementById("input-text");
                    content = textInput ? textInput.value.trim() : "Tekst QR";
                    break;
                    
                case "wifi":
                    const ssid = document.getElementById("input-ssid")?.value.trim() || "MojaSieć";
                    const pass = document.getElementById("input-password")?.value.trim() || "";
                    const enc = document.getElementById("input-encryption")?.value || "WPA";
                    const hidden = document.getElementById("input-hidden")?.checked ? "true" : "false";
                    
                    content = `WIFI:T:${enc};S:${ssid};P:${pass};H:${hidden};;`;
                    break;
                    
                case "email":
                    const email = document.getElementById("input-email")?.value.trim() || "";
                    const subject = document.getElementById("input-subject")?.value.trim() || "";
                    content = `mailto:${email}${subject ? `?subject=${encodeURIComponent(subject)}` : ''}`;
                    break;
                    
                case "phone":
                    const phone = document.getElementById("input-phone")?.value.trim() || "";
                    content = `tel:${phone}`;
                    break;
                    
                case "sms":
                    const smsPhone = document.getElementById("input-sms-phone")?.value.trim() || "";
                    const smsMsg = document.getElementById("input-sms-msg")?.value.trim() || "";
                    content = `SMSTO:${smsPhone}:${smsMsg}`;
                    break;
                    
                case "vcard":
                    const first = document.getElementById("input-firstname")?.value.trim() || "";
                    const last = document.getElementById("input-lastname")?.value.trim() || "";
                    const vphone = document.getElementById("input-vcard-phone")?.value.trim() || "";
                    const vemail = document.getElementById("input-vcard-email")?.value.trim() || "";
                    
                    content = `BEGIN:VCARD\nVERSION:3.0\nN:${last};${first}\nFN:${first} ${last}\nTEL:${vphone}\nEMAIL:${vemail}\nEND:VCARD`;
                    break;
            }
            
            return content;
        }
        
        function generateQR() {
            const canvas = document.getElementById("qr-canvas");
            const content = getQRContent();
            
            if (!content || content.trim() === "") {
                // Clear canvas
                const ctx = canvas.getContext("2d");
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, 240, 240);
                return;
            }
            
            // Update badge
            document.getElementById("qr-type-badge").innerHTML = types.find(t => t.id === currentType).label;
            
            // Generate QR
            try {
                QRCode.generate(content, canvas, 240);
                currentData = content;
                
                // Update status
                document.getElementById("qr-status").innerHTML = `
                    <i class="fa-solid fa-check text-xs"></i> 
                    <span class="font-extrabold">Gotowy</span>
                `;
                document.getElementById("qr-status").className = `text-xs font-semibold px-3 py-[1px] bg-emerald-100 text-emerald-700 rounded-3xl flex items-center justify-center gap-x-[5px]`;
            } catch(e) {
                console.error("QR error:", e);
                document.getElementById("qr-status").innerHTML = `
                    <i class="fa-solid fa-exclamation-circle text-xs"></i> 
                    <span class="font-extrabold">Błąd</span>
                `;
                document.getElementById("qr-status").className = `text-xs font-semibold px-3 py-[1px] bg-red-100 text-red-700 rounded-3xl flex items-center justify-center gap-x-[5px]`;
            }
        }
        
        function downloadQR() {
            const canvas = document.getElementById("qr-canvas");
            const link = document.createElement("a");
            link.download = `qr-${currentType}-${Date.now()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        }
        
        function copyToClipboard() {
            const canvas = document.getElementById("qr-canvas");
            
            canvas.toBlob(function(blob) {
                navigator.clipboard.write([
                    new ClipboardItem({ "image/png": blob })
                ]).then(() => {
                    const originalText = document.getElementById("qr-status").innerHTML;
                    document.getElementById("qr-status").innerHTML = `<i class="fa-solid fa-check-double"></i> <span class="font-extrabold">Skopiowano!</span>`;
                    
                    setTimeout(() => {
                        if (document.getElementById("qr-status")) {
                            generateQR();
                        }
                    }, 1400);
                }).catch(() => {
                    // Fallback
                    alert("Skopiowano link QR do schowka (jako tekst): " + currentData);
                });
            });
        }
        
        function shareQR() {
            const canvas = document.getElementById("qr-canvas");
            
            if (navigator.share) {
                canvas.toBlob(blob => {
                    const file = new File([blob], `qr-${currentType}.png`, { type: "image/png" });
                    
                    navigator.share({
                        title: "QR Code",
                        text: currentData,
                        files: [file]
                    }).catch(() => {});
                });
            } else {
                // Fallback for older devices
                const link = document.createElement("a");
                link.download = `qr-${currentType}.png`;
                link.href = canvas.toDataURL();
                link.click();
            }
        }
        
        function resetApp() {
            const container = document.getElementById("form-container");
            container.innerHTML = "";
            
            currentType = "url";
            createTypeSelector();
            updateForm();
            
            // Reset to defaults
            setTimeout(() => {
                const urlInput = document.getElementById("input-url");
                if (urlInput) urlInput.value = "https://apple.com";
                generateQR();
            }, 150);
        }
        
        // Initialize everything
        function initApp() {
            initializeTailwind();
            
            // Setup type selector
            createTypeSelector();
            
            // Setup initial form
            updateForm();
            
            // Initial QR generation
            setTimeout(() => {
                generateQR();
            }, 300);
            
            // Bonus: Make it feel even more iOS native
            // Double tap on QR to regenerate
            const qrCanvas = document.getElementById("qr-canvas");
            qrCanvas.addEventListener("dblclick", () => {
                generateQR();
            });
            
            // Keyboard support
            document.addEventListener("keydown", function(e) {
                if (e.key === "/" && document.activeElement.tagName === "BODY") {
                    e.preventDefault();
                    const firstInput = document.querySelector("#form-container input, #form-container textarea");
                    if (firstInput) firstInput.focus();
                }
            });
            
            // Easter egg: Long press on header resets
            const header = document.querySelector(".ios-header");
            if (header) {
                header.addEventListener("touchstart", function() {
                    let pressTimer = setTimeout(() => {
                        resetApp();
                    }, 800);
                    
                    header.addEventListener("touchend", function handler() {
                        clearTimeout(pressTimer);
                        header.removeEventListener("touchend", handler);
                    }, {once: true});
                });
            }
            
            // Show initial success toast for first load
            setTimeout(() => {
                const status = document.getElementById("qr-status");
                if (status) {
                    status.style.transitionDuration = "150ms";
                }
            }, 1200);
            
            // Ready message
            console.log("%c[QR Anka] Fully offline Apple-like QR generator initialized.", "color:#888");
        }
        
        // Boot the app
        window.onload = initApp;
    </script>
</body>
</html>
